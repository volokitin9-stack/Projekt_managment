# ---------------------------------------------------------------------------
# Workbook profile: engineering department MONTHLY WORK PLAN
# (one worksheet per month, rows = tasks).
#
# Everything is explicit and deterministic.  The first dry run copies these
# rules into state/mapping.proposed.yaml; after approval the approved copy is
# the permanent configuration used for every later file.
# Columns are located by HEADER TEXT, never by column letter, because column
# positions differ between months (January has an extra "Этап" column, the
# header row moved from row 3 to row 1, ...).
# ---------------------------------------------------------------------------
profile: monthly_work_plan
version: 1

# The profile applies to a workbook when a month-named worksheet has these headers.
required_headers: ["КО", "Марка", "Модель", "Продукт/Задача", "План на месяц", "Стадия проекта"]
header_search_rows: 10

# --- target month ------------------------------------------------------------
# "auto" = current calendar month; override per run with --month 2026-12 or
# PLAN_TARGET_MONTH=2026-12.  Only the worksheet of the target month is imported.
target_month: auto
month_names:
  1:  ["январь", "января", "янв", "january", "jan"]
  2:  ["февраль", "февраля", "фев", "february", "feb"]
  3:  ["март", "марта", "мар", "march", "mar"]
  4:  ["апрель", "апреля", "апр", "april", "apr"]
  5:  ["май", "мая", "may"]
  6:  ["июнь", "июня", "июн", "june", "jun"]
  7:  ["июль", "июля", "июл", "july", "jul"]
  8:  ["август", "августа", "авг", "august", "aug"]
  9:  ["сентябрь", "сентября", "сен", "сент", "september", "sep", "sept"]
  10: ["октябрь", "октября", "окт", "october", "oct"]
  11: ["ноябрь", "ноября", "ноя", "нояб", "november", "nov"]
  12: ["декабрь", "декабря", "дек", "december", "dec"]
# Worksheets whose name mentions the month but which are summaries/pivots of
# the month sheet.  They are reported, never imported.
derived_sheet_patterns: ["^сводн", "^компактн", "^общий", "pivot", "summary"]
# Explicit choice when several plan sheets exist for one month, e.g.
#   sheet_override: {"2026-11": "Ноябрь"}
sheet_override: {}

# --- columns (header text -> role) --------------------------------------------
columns:
  row_number:        ["№"]
  engineer:          ["КО"]
  sales_channel:     ["Канал продаж"]
  product_group:     ["ТГ"]
  priority:          ["Приоритет"]
  feasibility:       ["Выполнимо"]
  manufacturer:      ["Марка"]
  vehicle_model:     ["Модель"]
  vehicle_full:      ["Марка+Модель"]       # formula = Марка + Модель; used only as a cross-check
  product_type:      ["Продукт/Задача"]
  task_type:         ["План на месяц"]
  project_stage:     ["Стадия проекта"]
  task_group:        ["Группа задач"]
  article_number:    ["Артикул"]
  order_note:        ["Номер заказа"]
  items_outstanding: ["NOK"]               # "Факт NOK" in the month summary pivot
  items_delivered:   ["ОК", "OK"]          # "Факт ОК" in the month summary pivot
  probability_note:  ["Вероятность", "Вероятность2"]
  delivery_chance:   ["Шанс"]
  result:            ["Факт"]
  comment:           ["Комментарии", "Комментарий"]
  planned_hours:     ["План месяц"]
  actual_hours:      ["Факт месяц"]
  # columns whose header is a day number 1..31 hold hours worked on that day
day_columns: true

# --- row structure and categories ---------------------------------------------
# A value in the engineer column that starts a new section.
section_markers:
  "ДОП РАБОТЫ": extra_work      # unplanned assignments (free text, mostly no vehicle)
  "БАНК ЗАДАЧ": backlog         # task bank: future / pending work
# Dashboard category of each section (record_category).  Nothing is discarded:
# every section becomes its own category.
section_categories:
  main: main_project
  extra_work: additional_work
  backlog: backlog
# Stable dashboard identifiers: <prefix>-<hash of the identity fields>.
id_prefixes: {main_project: PRJ, additional_work: AW, backlog: BL}
# Task rows end at the first totals row; below it are totals, the resource
# table and the dropdown source lists (department vocabulary).
end_of_tasks_prefixes: ["Итого", "Запас часов"]
# Engineer-column values whose meaning is unknown: kept as original value,
# not used as a person, and the record is sent to review.
unknown_engineer_values: ["Н"]
# Engineer values that are teams of two people.
team_separator: "/"
# Only engineers of these activity types count as the project's responsible
# DESIGN engineer.  Scanning and fitment people stay activity-level assignees.
design_activity_types: [development, test_prototype, documentation, testing, transfer_extension,
                        engineering_change]

# --- project identity ----------------------------------------------------------
# Main project = Марка + Модель + Продукт/Задача (+ Артикул when it is one valid
# number).  Different products of one vehicle (e.g. engine protection,
# transmission protection, complete kit) are DIFFERENT projects and are never
# merged.  Matching is on normalised text; the file's spelling is displayed.
# The row number "№" is a running counter and is NOT an identifier.
identity: [manufacturer, vehicle_model, product_type]
article_pattern: "^[A-Za-z0-9][A-Za-z0-9.\\-/_]{2,40}$"
article_invalid_markers: ["ЗАПОЛНИТЬ"]
# A task cycle ends after one of these task groups (PDM upload closes the
# series cycle, the prototype-lab task closes the development cycle).  Several
# cycles of the same vehicle+product stay ONE project with numbered cycles;
# cycles WITHOUT a vehicle are not merged and go to review.
cycle_closing_task_groups: ["Выгрузка в PDM", "Лабаратория, разбор опытников, фотоконтент"]
# Planned rows of the main section without a vehicle that are operational work
# (support, КД/1С checks, independent scanning not tied to a development
# project).  They go to the category below with their rows, assignees and hours.
# Other vehicle-less blocks stay in the review queue.
operational_category: additional_work
operational_product_groups: ["Прочее", "Доп", "Доп."]
operational_stages: ["Операционка", "Не профильная работа", "Административка",
                     "Работа по новым проектам компании"]

# --- workflow: task -> activity type -------------------------------------------
# Ordered rules, first match wins.  Conditions compare normalised text of the
# task ("План на месяц"), project stage ("Стадия проекта") and task group
# ("Группа задач").  Main stages: scanning, development, test_prototype,
# measurement, documentation.  Additional activity types (never counted as a
# main stage): testing, transfer_extension, engineering_change.
activity_rules:
  - {when: {project_stage: ["Тесты"]}, type: testing, why: "tooling/product tests"}
  - {when: {project_stage: ["Улучшения конструктивов (запрос пр-во, акты, рекламации)",
                            "Изменения (запросы, акты, рекламации)"]},
     type: engineering_change, why: "change requests / design improvements of serial products"}
  - {when: {task_type: ["Улучшения конструктивов (запрос пр-во, акты, рекламации)"]},
     type: engineering_change, why: "change request task"}
  - {when: {task_type: ["Отсканировать"]}, type: scanning, why: "vehicle scanning"}
  - {when: {task_type: ["Разработать", "Доработать", "Доработать (GEN 2)", "Доработать (GEN 3)"]},
     type: development, why: "CAD design / redesign"}
  - {when: {task_type: ["Заказать"]}, type: test_prototype, why: "ordering the test prototype"}
  - {when: {task_group: ["Лабаратория, разбор опытников, фотоконтент"]}, type: test_prototype,
     why: "laboratory analysis of prototypes"}
  - {when: {task_type: ["Примерить"]}, type: measurement, why: "trial fit on the vehicle (task group 'Замеры')"}
  - {when: {task_group: ["Замеры"]}, type: measurement, why: "measurements"}
  - {when: {task_type: ["Перевод", "Перевод из OEM", "Расширение"]}, type: transfer_extension,
     why: "transfer/extension of an existing product ('Серия перевод')"}
  - {when: {task_type: ["КД", "1С"]}, type: documentation,
     why: "design documentation (КД) / 1C registration task - also inside 'Серия перевод' projects"}
  - {when: {task_group: ["Выгрузка в PDM"]}, type: documentation, why: "PDM upload ('Оформление')"}
  - {when: {project_stage: ["Сканирование"]}, type: scanning, why: "project stage"}
  - {when: {project_stage: ["Разработка"]}, type: development, why: "project stage"}
  - {when: {project_stage: ["Примерка"]}, type: measurement, why: "project stage"}
  - {when: {project_stage: ["Серия", "Оформление"]}, type: documentation, why: "project stage"}
  - {when: {project_stage: ["Серия перевод"]}, type: transfer_extension, why: "project stage"}

# --- activity progress (evidence-based only) ------------------------------------
# Hours are EFFORT, not completion: nothing is ever marked done automatically.
# 'ОК' / 'NOK' are preserved as original values (meaning not verified).
status_rules:
  - {if: actual_hours_positive, status: in_progress, why: "hours were logged this month (effort, not completion)"}
  - {if: planned_hours_positive, status: planned, why: "planned this month, no hours logged yet"}

# --- priorities ------------------------------------------------------------------
# Scale from the 'Приоритеты' sheet: 1 highest (sub-levels 1.1-1.3), 2, 3.
# Original value is always kept in extra_attributes.priority_original.
priority_map: {"1": high, "1.1": high, "1.2": high, "1.3": high, "2": medium, "3": low}
# Values whose meaning is not verified: dashboard priority stays empty, flagged.
undefined_priority_values: ["0"]

# Value kinds for which an unseen value after approval sends the record to review.
strict_value_kinds: [task_type, project_stage, task_group, priority]
