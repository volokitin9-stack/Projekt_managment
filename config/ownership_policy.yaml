# ---------------------------------------------------------------------------
# Field ownership policy: who is the authority for each dashboard field.
#
#   planning_file : the planning file controls the field.  The agent writes it
#                   whenever the file has a non-empty, different value.
#   dashboard     : people edit the field in the dashboard.  The agent only
#                   fills it while the dashboard value is empty; a different
#                   file value is reported as a conflict and NOT written.
#   image_agent / other : another system owns it.  The planning agent never
#                   touches it.
#
# Rules that apply regardless of ownership:
#   * an empty value in the file never clears a dashboard value;
#   * projects missing from a new file are never deleted;
#   * photos, attachments, comments and history are never sent by this agent.
# ---------------------------------------------------------------------------

default_owner: planning_file

fields:
  external_project_id:    planning_file
  record_category:        planning_file
  project_name:           planning_file
  manufacturer:           planning_file
  vehicle_model:          planning_file
  product_type:           planning_file
  article_number:         planning_file
  assigned_engineer:      planning_file
  priority:               planning_file
  priority_original:      planning_file
  planned_stage:          planning_file   # suggestion only; the confirmed stage (status) is never written
  work_status:            planning_file
  planned_start_date:     planning_file
  planned_deadline:       planning_file
  actual_completion_date: planning_file
  stages:                 planning_file
  dependencies:           planning_file
  extra_attributes:       planning_file
  source_file:            planning_file
  source_sheet:           planning_file
  source_row:             planning_file
  source_rows:            planning_file
  last_plan_month:        planning_file
  status:                 dashboard       # confirmed Kanban stage: set by people (or explicit transitions)
  description:            dashboard
  comments:               dashboard
  photos:                 image_agent
  attachments:            image_agent

# What to do when a planning_file-owned field was last changed MANUALLY in the
# dashboard (the backend tracks the last writer of each field) and the file now
# carries a different value:
#   report_and_keep      - keep the manual value, report a conflict (safest; default)
#   overwrite_and_report - write the file value, report the overwrite
on_manual_edit: report_and_keep

# Fields that identify a project.  If the file carries a DIFFERENT non-empty
# value for an already-matched project (e.g. the model of ENG-003 suddenly
# reads "Jolion" instead of "Dargo" - typically a shifted merged cell), the
# change is not applied: the project goes to review.
identity_fields: [external_project_id, article_number, manufacturer, vehicle_model, product_type]

# Automatic (unattended) synchronisation - PLAN_AUTO_SYNC_ENABLED=true.
# For a project that already exists, the automatic mode applies ONLY:
#   * changes of the fields listed below, and
#   * changed values (hours, dates, progress, ...) of activities that already
#     exist for the plan month.
# Everything else is held for review in the dashboard and is NOT written:
#   new projects, identity changes, engineer changes, suggested-stage changes,
#   new or removed activities, records with ambiguities, and fields that were
#   edited manually (conflicts). The confirmed stage is never changed.
auto_sync:
  project_fields:
    - priority
    - priority_original
    - work_status
    - planned_start_date
    - planned_deadline
    - actual_completion_date
    - stages
    - dependencies
    - extra_attributes
    - source_file
    - source_sheet
    - source_row
    - source_rows
    - last_plan_month
