# Railway build config for the legacy Nixpacks builder (server/index.js only — see
# docs/RAILWAY_DEPLOYMENT.md). INACTIVE while Railway's Builder is set to Railpack (the current
# default, see railpack.json at the repo root) - Railpack does not read this file at all. Kept
# only so the Node-only pin below still applies automatically if the Builder is ever switched back
# to Nixpacks; it is not consulted otherwise, and silently diverging from railpack.json here would
# go unnoticed, so keep the two in sync if you change one.
#
# This repo also has requirements.txt (the plan_agent Python package), which Nixpacks' own
# auto-detection could mistake for the primary app or try to build alongside Node. Railway never
# needs Python: in the remote_agent topology this service is deployed under, the corporate Excel
# file is read and plan_agent is run entirely on the Windows laptop
# (plan_agent/windows_agent.py) — this service only ever receives an already-produced --json
# report over HTTPS. Pinning the Node-only build here keeps the Railway build fast and avoids that
# ambiguity; it has no effect on the Windows laptop, which never reads this file.
[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm ci --omit=dev"]

[start]
cmd = "npm start"
